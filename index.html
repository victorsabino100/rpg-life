/* ============================================================
   RPG LIFE — visual system (CSS-only refresh, brand palette)
   Navy 1A2744 · Blue 42B2DD · Pink D95273 · Off-white F5F1E8
   ============================================================ */
:root {
  --bg: #F5F5FB;
  --surface: #FFFFFF;
  --surface2: #EEEFF7;
  --border: #E3E4EF;
  --border-soft: #EDEEF6;

  --primary: #6C63FF;
  --primary-l: #9089FF;
  --primary-d: #514BC4;
  --gold: #FF6F5E;
  --pink: #FF6F5E;
  --pink-l: #FF9184;
  --green: #12A98A;
  --red: #E5533F;
  --orange: #F0913E;
  --blue: #3AAEE0;

  --text: #1A1B29;
  --text-2: #1A1B2980;
  --muted: #7A7E92;
  --navy: #1A1B29;

  --sidebar-w: 232px;

  --r-sm: 12px;
  --r: 18px;
  --r-lg: 26px;
  --shadow-sm: 0 1px 2px rgba(20,22,45,.05), 0 2px 8px rgba(20,22,45,.06);
  --shadow-md: 0 10px 30px rgba(20,22,45,.10);
  --shadow-lg: 0 24px 60px rgba(20,22,45,.16);
  --ring: 0 0 0 3px rgba(108,99,255,.24);

  --grad-brand: linear-gradient(120deg, #7C83FF, #FF7A6B);
  --font-display: 'Sora', 'Segoe UI', sans-serif;
  --font-body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Space Mono', ui-monospace, monospace;
}

html[data-theme="dark"] {
  --bg: #0B0D14 !important;
  --surface: #13151F;
  --surface2: #1B1E2B;
  --border: #272B3A;
  --border-soft: #20232F;

  --primary: #7C83FF !important;
  --primary-l: #A2A7FF !important;
  --primary-d: #5B62E0;
  --gold: #FF7A6B !important;
  --pink: #FF7A6B;
  --pink-l: #FF9A8E;
  --green: #34D8B4;
  --red: #FF6B6B;
  --orange: #FFB454;
  --blue: #56C2F5;

  --text: #EAECF3;
  --muted: #8A90A6;
  --navy: #EAECF3;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.35);
  --shadow-md: 0 10px 30px rgba(0,0,0,.45);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.6);
  --ring: 0 0 0 3px rgba(124,131,255,.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background .3s ease, color .3s ease;
}

#app { display: flex; height: 100vh; }

h1,h2,h3,h4 { font-family: var(--font-display); letter-spacing: -.01em; }

/* ================= SIDEBAR ================= */
#sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  padding-top: 6px;
}

.nav-list { list-style: none; padding: 10px; flex: 1; }
.nav-list li {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 13px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 14px; font-weight: 500;
  color: var(--muted);
  transition: background .16s ease, color .16s ease, transform .16s ease;
  margin-bottom: 2px;
  position: relative;
}
.nav-list li span { font-size: 16px; width: 20px; text-align: center; filter: saturate(1.05); }
.nav-list li span svg { width: 19px; height: 19px; display: block; margin: 0 auto; }
.nav-list li:hover { background: var(--surface2); color: var(--text); transform: translateX(2px); }
.nav-list li.active {
  background: var(--navy); color: #F5F1E8; font-weight: 600;
  box-shadow: var(--shadow-sm);
}
html[data-theme="dark"] .nav-list li.active { background: linear-gradient(120deg, rgba(82,190,230,.22), rgba(232,106,140,.18)); color: #fff; }
.nav-list li.active::before {
  content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--primary);
}

.sidebar-footer { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.sidebar-footer button {
  width: 100%; padding: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--muted);
  cursor: pointer; font-size: 13px; font-weight: 500; font-family: var(--font-body);
  transition: all .16s ease;
}
.sidebar-footer button:hover { color: var(--text); border-color: var(--primary); background: var(--surface); }
#btn-reset { margin-top: 0; }
#btn-reset:hover { color: var(--red); border-color: var(--red); }

/* ================= MAIN ================= */
#main-content { flex: 1; overflow-y: auto; padding: 30px 34px; }
@media (min-width: 1500px){ #main-content{ padding: 34px 48px; } }

.section { display: none; }
.section.active { display: block; animation: sectionIn .34s cubic-bezier(.22,1,.36,1); }
@keyframes sectionIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ================= CARDS ================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-title {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  color: var(--muted);
  text-transform: uppercase; letter-spacing: .12em;
  margin-bottom: 14px;
}

/* ================= GRIDS ================= */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }

.tier-road { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
.tier-node { flex:1; min-width:96px; text-align:center; padding:14px 8px; border-radius:16px; border:1.5px solid var(--border); background:var(--surface2); transition:all .2s ease; }
.tier-node.current { border-color:var(--pink); background:linear-gradient(180deg,var(--surface),rgba(217,82,115,.08)); box-shadow:0 6px 18px rgba(217,82,115,.2); transform: translateY(-2px); }
.tier-node.locked { opacity:.55; }
.tier-av { position:relative; display:flex; justify-content:center; }
.tier-node.locked .tier-av svg { filter:grayscale(.7) brightness(.96); }
.tier-lock { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px; }
.tier-nm { font-family:var(--font-display); font-weight:700; font-size:12px; color:var(--navy); margin-top:5px; }
.tier-lv { font-size:11px; color:var(--muted); margin-top:2px; }
.tier-node.current .tier-lv { color:var(--pink); font-weight:700; }

.dash-today { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.dash-day-card { margin:0; display:flex; flex-direction:column; }
.dash-day-head { display:flex; align-items:center; justify-content:space-between; font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--navy); margin-bottom:12px; }
.dash-day-head .btn { padding:3px 9px; font-size:11px; }
.dash-line { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:var(--r-sm); background:var(--surface2); margin-bottom:6px; font-size:13px; transition: background .15s ease, transform .12s ease; }
.dash-line:hover { transform: translateX(2px); }
.dash-line-time { font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--primary); min-width:38px; }
.dash-line-name { flex:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dash-line-val { font-family:var(--font-mono); font-weight:700; color:var(--red); font-size:12px; }
.dash-chk { cursor:pointer; }
.dash-chk.done .dash-line-name { text-decoration:line-through; color:var(--muted); }
.dash-chk-box { width:18px; height:18px; border-radius:6px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; transition: all .16s ease; }
.dash-chk.done .dash-chk-box { background:var(--green); border-color:var(--green); }
.dash-empty { color:var(--muted); font-size:12px; padding:8px 4px; }

/* ================= BUTTONS ================= */
.btn {
  padding: 9px 17px; border-radius: var(--r-sm); border: none; cursor: pointer;
  font-size: 14px; font-weight: 600; font-family: var(--font-body);
  white-space: nowrap;
  transition: transform .12s ease, box-shadow .16s ease, background .16s ease, filter .16s ease;
}
.section-header h1 { line-height: 1.15; }
.section-header > *:last-child { flex-shrink: 0; }
.btn:active { transform: translateY(1px) scale(.985); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(66,178,221,.28); }
.btn-primary:hover { background: var(--primary-d); box-shadow: 0 6px 16px rgba(66,178,221,.36); }
.btn-gold { background: var(--pink); color: #fff; box-shadow: 0 4px 12px rgba(217,82,115,.28); }
.btn-gold:hover { filter: brightness(1.05); }
.btn-sm { padding: 6px 11px; font-size: 12px; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); background: var(--surface2); }

/* ================= INPUTS ================= */
input, textarea, select {
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text); padding: 9px 13px; font-size: 14px; font-family: var(--font-body);
  outline: none; transition: border-color .16s ease, box-shadow .16s ease, background .16s ease; width: 100%;
}
input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: var(--ring); background: var(--surface); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 5px; font-weight: 500; }
.form-group { margin-bottom: 15px; }
.form-row { display: flex; gap: 10px; }
.form-row > * { flex: 1; }

/* ================= MODAL ================= */
#modal-overlay { position: fixed; inset: 0; background: rgba(16,24,40,.55); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#modal-overlay.hidden { display: none; }
#modal-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  padding: 30px; min-width: 420px; max-width: 620px; width: 90%; max-height: 85vh;
  overflow-y: auto; position: relative; box-shadow: var(--shadow-lg);
  animation: modalIn .26s cubic-bezier(.22,1,.36,1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.modal-close { position: absolute; top: 16px; right: 16px; background: var(--surface2); border: none; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; transition: all .16s ease; }
.modal-close:hover { color: var(--text); background: var(--border); }
.modal-title { font-family: var(--font-display); font-size: 19px; font-weight: 800; margin-bottom: 20px; }
.ev-title-input { font-size: 20px !important; font-weight: 700; padding: 8px 4px !important; border: none !important; border-bottom: 2px solid var(--border) !important; border-radius: 0 !important; background: transparent !important; box-shadow: none !important; }
.ev-title-input:focus { border-bottom-color: var(--primary) !important; outline: none; }
.ev-check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); margin: 4px 0 14px; cursor: pointer; }
.ev-check input { width: 16px; height: 16px; cursor: pointer; }

/* ================= BADGES ================= */
.badge { display: inline-block; padding: 3px 9px; border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: .01em; }
.chip { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: all .12s; }
.chip:hover { border-color: var(--primary); color: var(--text); }
.chip-on { background: var(--primary); border-color: var(--primary); color: #fff; }
.badge-purple { background: rgba(66,178,221,.16); color: var(--primary-d); }
.badge-gold { background: rgba(217,82,115,.16); color: var(--pink); }
.badge-green { background: rgba(30,158,115,.16); color: var(--green); }
.badge-red { background: rgba(219,86,72,.16); color: var(--red); }
.badge-blue { background: rgba(66,178,221,.16); color: var(--primary-d); }
.badge-pink { background: rgba(217,82,115,.16); color: var(--pink); }
.badge-orange { background: rgba(224,138,60,.18); color: var(--orange); }

/* ================= TOAST / LEVEL UP ================= */
#xp-toast { position: fixed; bottom: 24px; right: 24px; background: var(--navy); border: 1px solid var(--pink); border-radius: 12px; padding: 13px 20px; color: #F5F1E8; font-family: var(--font-mono); font-weight: 700; font-size: 15px; z-index: 200; box-shadow: var(--shadow-lg); animation: slideIn .32s cubic-bezier(.22,1,.36,1); }
#xp-toast.hidden { display: none; }
@keyframes slideIn { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }

#levelup-overlay { position: fixed; inset: 0; background: rgba(16,24,40,.8); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 300; animation: fadeIn .2s ease; }
#levelup-overlay.hidden { display: none; }
.levelup-card { text-align: center; padding: 46px; background: linear-gradient(150deg, var(--surface), rgba(217,82,115,.1)); border: 2px solid var(--pink); border-radius: 24px; box-shadow: var(--shadow-lg); animation: modalIn .3s cubic-bezier(.22,1,.36,1); }
.levelup-emoji { font-size: 64px; margin-bottom: 12px; animation: pulse 1s infinite; }
.levelup-title { font-family: var(--font-display); font-size: 34px; font-weight: 900; color: var(--pink); letter-spacing: .08em; }
#levelup-msg { color: var(--muted); margin: 12px 0 26px; }
.levelup-card button { padding: 11px 22px; border-radius: var(--r-sm); border: none; background: var(--navy); color: #F5F1E8; font-weight: 700; font-family: var(--font-body); cursor: pointer; font-size: 14px; transition: transform .12s ease; }
.levelup-card button:active { transform: scale(.97); }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* ================= SECTION HEADER / EMPTY / MISC ================= */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 12px; }
.section-header h1 { font-family: var(--font-display); font-size: 24px; font-weight: 800; }
.section-header h1 span { margin-right: 8px; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty-state .empty-icon { font-size: 42px; margin-bottom: 12px; opacity: .8; }

::-webkit-scrollbar { width: 0 !important; height: 0 !important; background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; }
* { scrollbar-width: none; -ms-overflow-style: none; }

.tag { display: inline-block; padding: 3px 9px; background: var(--surface2); border: 1px solid var(--border); border-radius: 100px; font-size: 11px; color: var(--muted); cursor: pointer; margin: 2px; transition: all .15s ease; }
.tag:hover { border-color: var(--primary); color: var(--primary); }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-high { background: var(--red); }
.dot-med  { background: var(--orange); }
.dot-low  { background: var(--green); }

.page-title { font-family: var(--font-display); font-size: 26px; font-weight: 900; background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; letter-spacing: -.02em; }
.page-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 26px; }

/* ================= CHARACTER — SIDEBAR MINI ================= */
#char-mini { padding: 18px 14px; border-bottom: 1px solid var(--border); }
.char-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--grad-brand); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 8px; border: 2px solid var(--pink); box-shadow: 0 0 18px rgba(217,82,115,.3); }
.char-name { font-family: var(--font-display); font-weight: 700; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.char-class-badge { text-align: center; font-size: 11px; color: var(--pink); margin: 2px 0 9px; font-weight: 600; }
.char-xp-bar-wrap { background: var(--surface2); border-radius: 100px; height: 6px; margin-bottom: 4px; overflow: hidden; }
.char-xp-bar { height: 100%; background: var(--grad-brand); border-radius: 100px; transition: width .6s cubic-bezier(.22,1,.36,1); }
.char-xp-text { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-align: center; }

/* ================= CHARACTER PAGE ================= */
.char-page { background: linear-gradient(135deg, var(--surface), rgba(66,178,221,.09)); border: 1px solid var(--border); border-radius: 20px; padding: 26px; display: flex; gap: 26px; align-items: flex-start; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
.char-left { flex-shrink: 0; text-align: center; }
.char-big-avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--grad-brand); display: flex; align-items: center; justify-content: center; font-size: 52px; margin: 0 auto 10px; border: 3px solid var(--pink); box-shadow: 0 0 32px rgba(217,82,115,.36); animation: glow 3.4s ease-in-out infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 0 22px rgba(217,82,115,.34); } 50% { box-shadow: 0 0 40px rgba(217,82,115,.6); } }
.char-level-badge { display: inline-block; background: var(--pink); color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 13px; padding: 3px 12px; border-radius: 100px; margin-bottom: 4px; }
.char-class-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--primary-d); }
.char-title-text { color: var(--muted); font-size: 13px; }
.char-right { flex: 1; }
.char-name-input { font-family: var(--font-display); font-size: 21px; font-weight: 800; background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; color: var(--text); padding: 2px 0; margin-bottom: 12px; width: 100%; box-shadow: none !important; }
.char-name-input:focus { border-bottom-color: var(--primary); }
.char-total-xp { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.char-total-xp b { color: var(--pink); }
.xp-progress-wrap { margin-bottom: 16px; }
.xp-progress-label { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.xp-bar-outer { background: var(--surface2); border-radius: 100px; height: 11px; overflow: hidden; }
.xp-bar-inner { height: 100%; background: var(--grad-brand); border-radius: 100px; transition: width .6s cubic-bezier(.22,1,.36,1); position: relative; }

/* ================= ATTRIBUTES ================= */
.attrs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.attr-row { display: flex; align-items: center; gap: 9px; }
.attr-icon { font-size: 18px; flex-shrink: 0; }
.attr-info { flex: 1; }
.attr-name { font-size: 11px; color: var(--muted); }
.attr-level { font-family: var(--font-display); font-size: 13px; font-weight: 700; }
.attr-bar-outer { background: var(--surface2); border-radius: 100px; height: 5px; margin-top: 3px; overflow: hidden; }
.attr-bar-inner { height: 100%; border-radius: 100px; transition: width .6s cubic-bezier(.22,1,.36,1); }

/* ================= ACHIEVEMENTS ================= */
.achievements-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.achievement { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; text-align: center; min-width: 82px; transition: transform .16s ease; }
.achievement.earned { border-color: var(--pink); background: linear-gradient(180deg, var(--surface), rgba(217,82,115,.07)); }
.achievement.earned:hover { transform: translateY(-3px); }
.achievement .ach-icon { font-size: 26px; }
.achievement .ach-name { font-size: 11px; color: var(--muted); margin-top: 5px; }
.achievement.earned .ach-name { color: var(--pink); font-weight: 600; }
.achievement.locked { opacity: .4; filter: grayscale(1); }

/* ================= STREAK ================= */

/* ================= TASK ITEM ================= */
.task-item { display: flex; align-items: center; gap: 11px; padding: 11px 15px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; transition: border-color .16s ease, transform .12s ease, box-shadow .16s ease; cursor: default; }

.task-check { width: 21px; height: 21px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .16s ease; font-size: 12px; }
.task-check:hover { border-color: var(--primary); transform: scale(1.1); }

.task-item:hover .task-delete { opacity: 1; }

/* ================= CALENDAR ================= */
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px; }
.cal-header { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-align:center; padding:4px; text-transform:uppercase; }
.cal-day { aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:13px; background:var(--surface2); transition:all .15s ease; position:relative; }

/* ================= NOTES DUAL PANEL ================= */
.notes-topbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }

.notes-date-select { flex:1; max-width:360px; padding:12px 15px; background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--text); font-size:15px; font-weight:600; cursor:pointer; }

.notes-date-del-btn { flex-shrink:0; width:46px; height:46px; background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--muted); cursor:pointer; font-size:16px; transition:all .15s ease; }

.notes-date-input { width:auto; min-width:150px; padding:9px 12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; font-weight:600; cursor:pointer; }

.ncal-nav { background:var(--surface2); border:1px solid var(--border); border-radius:8px; width:28px; height:28px; color:var(--text); cursor:pointer; font-size:16px; line-height:1; transition:all .15s ease; }
.ncal-nav:hover { border-color:var(--primary); color:var(--primary); }
.ncal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.ncal-w { text-align:center; font-family:var(--font-mono); font-size:10px; color:var(--muted); font-weight:700; padding-bottom:3px; }
.ncal-day { position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12px; border-radius:8px; cursor:pointer; color:var(--text); transition:all .12s ease; }

.note-date-item { padding:9px 13px; border-radius:var(--r-sm); cursor:pointer; font-size:13px; color:var(--muted); transition:all .15s ease; margin-bottom:4px; border-left:3px solid transparent; position:relative; }
.note-date-item:hover { background:var(--surface2); color:var(--text); }

.note-toolbar { display:flex; gap:5px; margin-bottom:8px; flex-wrap:wrap; }

.note-chk { display:flex; align-items:flex-start; gap:8px; margin:3px 0; }
.note-chk-box { flex:none; width:19px; height:19px; margin-top:2px; border:2px solid var(--muted); border-radius:50%; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:12px; line-height:1; color:#fff; -webkit-user-select:none; user-select:none; transition:all .14s ease; }

#sel-toolbar { position:fixed; z-index:600; display:none; align-items:center; gap:3px; padding:5px 7px; border-radius:12px; background:color-mix(in srgb, var(--surface) 78%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.24); animation:selbarIn .12s ease; }

@keyframes selbarIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
#sel-toolbar button { background:transparent; border:none; color:var(--text); cursor:pointer; border-radius:7px; padding:4px 8px; font-family:var(--font-body); line-height:1; display:inline-flex; align-items:center; justify-content:center; transition:background .12s ease; }

#sel-toolbar .sel-sw.clear { background:var(--surface2); font-size:12px; color:var(--muted); }

/* ================= CHECKLIST ================= */
.checklist-item { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:4px; margin-bottom:5px; background:var(--surface2); transition:all .15s ease; }

.checklist-subs { margin:0 0 6px 34px; display:flex; flex-direction:column; gap:3px; }
.checklist-sub { display:flex; align-items:center; gap:8px; font-size:13px; }

/* ================= FLUXOGRAMAS ================= */

.flow-node.root { font-family:var(--font-display); font-size:18px; font-weight:800; max-width:280px; min-width:150px; padding:11px 19px; }
.flow-node.sel { box-shadow:0 0 0 3px rgba(124,131,255,.55), 0 2px 8px rgba(0,0,0,.16); }
.flow-node.linking { box-shadow:0 0 0 3px rgba(255,122,107,.6), 0 2px 8px rgba(0,0,0,.16); }
.fl-resize { position:absolute; right:-5px; bottom:-5px; width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid var(--primary); cursor:nwse-resize; touch-action:none; box-shadow:0 1px 3px rgba(0,0,0,.3); z-index:6; }
.flow-editbar textarea#fl-node-text { flex:1; min-width:120px; resize:none; overflow:hidden; font-family:var(--font-body); line-height:1.35; }
.flow-toggle { position:absolute; right:-32px; top:50%; transform:translateY(-50%); width:25px; height:25px; border-radius:50%; background:var(--surface); border:2.5px solid var(--primary); color:var(--text); font-size:13px; font-weight:800; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; box-shadow:var(--shadow-sm); z-index:3; }
.flow-toggle.closed { color:#fff; }
.flow-editbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; padding:11px 13px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); }
.flow-editbar input[type="text"] { flex:1; min-width:140px; }
.flow-swatch { width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex:0 0 auto; padding:0; }
.flow-swatch.on { border-color:var(--text); }
.flow-hint { font-size:12px; color:var(--muted); margin-top:8px; }
@media (max-width:820px){ .flow-wrap { height:calc(100dvh - 380px); min-height:320px; } }
.backlinks { margin-top:16px; }
.backlinks-title { font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:8px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.backlink-item { font-size:12px; color:var(--primary-d); cursor:pointer; padding:4px 9px; border-radius:100px; display:inline-block; margin:2px; background:rgba(66,178,221,.12); transition:all .15s ease; }
.backlink-item:hover { background:var(--primary); color:#fff; }

/* ================= FINANCE ================= */
.fin-tabs { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
.fin-tab { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:8px 15px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; transition:all .15s ease; }
.fin-tab:hover { color:var(--text); border-color:var(--primary); }
.fin-tab.active { background:var(--navy); border-color:var(--navy); color:#F5F1E8; font-weight:600; }
html[data-theme="dark"] .fin-tab.active { background:var(--primary); border-color:var(--primary); color:#fff; }
.fin-summary-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px; }
.fin-stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px; box-shadow:var(--shadow-sm); transition:transform .16s ease; }
.fin-stat-card:hover { transform:translateY(-2px); }
.fsc-label { font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px; }
.fsc-value { font-family:var(--font-display); font-size:20px; font-weight:800; }
.fin-stat-card.income .fsc-value { color:var(--green); }
.fin-stat-card.expense .fsc-value { color:var(--red); }
.fin-stat-card.balance-pos .fsc-value { color:var(--primary-d); }
.fin-stat-card.balance-neg .fsc-value { color:var(--red); }
.fin-stat-card.paid .fsc-value { color:var(--green); }
.fin-stat-card.overdue .fsc-value { color:var(--red); }
.tx-row { display:flex; align-items:center; gap:11px; padding:11px; background:var(--surface2); border-radius:var(--r-sm); margin-bottom:6px; transition:transform .12s ease; }
.tx-row:hover { transform:translateX(2px); }
.tx-icon-box { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.tx-name { font-size:14px; font-weight:600; }
.tx-cat { font-size:11px; color:var(--muted); }
.tx-amount { font-family:var(--font-mono); font-weight:700; font-size:14px; white-space:nowrap; }
.tx-amount.income { color:var(--green); }
.tx-amount.expense { color:var(--red); }
.tx-del, .tx-edit { background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; opacity:.55; transition:all .15s ease; font-size:13px; }
.tx-row:hover .tx-del, .tx-row:hover .tx-edit, .fix-row:hover .tx-del, .fix-row:hover .tx-edit { opacity:1; }
.tx-del:hover { color:var(--red); opacity:1; }
.tx-edit:hover { color:var(--primary); opacity:1; }
.fin-totals-bar { position:sticky; bottom:0; display:flex; flex-wrap:wrap; gap:18px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:13px 19px; margin-top:12px; box-shadow:0 -6px 20px rgba(26,39,68,.08); }
.fin-total-item { display:flex; align-items:center; gap:6px; font-size:14px; }
.fin-total-item b { font-family:var(--font-mono); font-size:15px; }
.fin-total-label { color:var(--muted); font-size:12px; }
.fin-total-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
.fin-table { width:100%; border-collapse:collapse; }
.fin-table th { font-family:var(--font-mono); font-size:10px; color:var(--muted); text-align:left; padding:9px 11px; border-bottom:1px solid var(--border); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.fin-table td { padding:11px; border-bottom:1px solid var(--border-soft); font-size:13px; }
.fin-table tr:last-child td { border-bottom:none; }
.fin-table tbody tr { transition:background .12s ease; }
.fin-table tbody tr:hover { background:var(--surface2); }
.fix-row.status-paid td { opacity:.55; }
.fix-row.status-overdue { background:rgba(219,86,72,.06); }
.cat-pill { background:var(--surface2); border:1px solid var(--border); border-radius:100px; padding:3px 9px; font-size:11px; }
.status-sel { font-size:12px; padding:3px 5px; border-radius:7px; width:auto; }
.fixed-status-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.fin-upcoming { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft); }
.fin-upcoming:last-child { border-bottom:none; }
.fin-upcoming-name { flex:1; font-size:13px; }
.fin-upcoming-date { font-family:var(--font-mono); font-size:12px; color:var(--muted); }
.fin-upcoming-val { font-family:var(--font-mono); font-size:13px; font-weight:700; }
.fin-card-mini { padding:11px 15px; background:var(--surface2); border-radius:var(--r-sm); margin-bottom:8px; }
.debt-card, .saving-card { background:var(--surface2); border-radius:var(--r); padding:17px; margin-bottom:12px; }
.cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.credit-card { border-radius:18px; padding:20px; min-height:132px; position:relative; font-family:var(--font-body); box-shadow:var(--shadow-md); transition:transform .18s ease; }
.credit-card:hover { transform:translateY(-3px); }
.cc-bank { font-family:var(--font-display); font-size:20px; font-weight:900; letter-spacing:.04em; opacity:.95; }
.cc-number { font-family:var(--font-mono); font-size:16px; letter-spacing:.14em; margin:12px 0 6px; }
.cc-name { font-size:12px; opacity:.85; margin-bottom:6px; }
.cc-details { display:flex; gap:10px; font-family:var(--font-mono); font-size:11px; opacity:.85; }
.cc-limit { font-size:12px; opacity:.75; margin-top:4px; }
.fin-profile-sel { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:var(--r-sm); padding:8px 11px; font-size:13px; font-weight:600; cursor:pointer; max-width:170px; }

/* ================= REWARDS ================= */
.reward-balance-card { display:flex; align-items:center; gap:17px; padding:18px 22px; background:linear-gradient(120deg,rgba(217,82,115,.14),rgba(66,178,221,.12)); border:1px solid rgba(217,82,115,.3); border-radius:var(--r-lg); margin-bottom:22px; }
.reward-balance-icon { font-size:38px; }
.reward-balance-value { font-family:var(--font-display); font-size:26px; font-weight:900; color:var(--pink); }
.reward-balance-sub { font-size:12px; color:var(--muted); }
.rewards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(162px,1fr)); gap:13px; }
.reward-card { background:var(--surface2); border:1px solid var(--border); border-radius:var(--r); padding:17px; text-align:center; position:relative; transition:all .18s ease; }
.reward-card:hover:not(.cant-afford) { border-color:var(--pink); transform:translateY(-3px); box-shadow:var(--shadow-md); }
.reward-card.cant-afford { opacity:.5; }
.reward-icon { font-size:38px; margin-bottom:9px; }
.reward-name { font-size:13px; font-weight:600; margin-bottom:6px; }
.reward-cost { font-family:var(--font-mono); font-size:12px; color:var(--pink); margin-bottom:11px; font-weight:700; }
.reward-del { position:absolute; top:7px; right:7px; background:none; border:none; color:var(--muted); cursor:pointer; opacity:0; font-size:12px; transition:opacity .15s ease; }
.reward-card:hover .reward-del { opacity:1; }
.history-item { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
.history-item:last-child { border-bottom:none; }

/* ================= SHOPPING ================= */
.shop-filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.shop-filter { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:7px 15px; font-size:13px; color:var(--muted); cursor:pointer; transition:all .15s ease; }
.shop-filter:hover, .shop-filter.active { border-color:var(--primary); color:var(--primary); }
.shop-filter.active { background:var(--surface2); font-weight:600; }
.shop-stats { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:12px; padding:9px 13px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); }
.shop-item { display:flex; align-items:flex-start; gap:11px; padding:13px 15px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); margin-bottom:8px; transition:all .16s ease; }
.shop-item:hover { border-color:var(--primary); transform:translateX(2px); }
.shop-item.bought { opacity:.5; }
.shop-check { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; margin-top:1px; transition:all .16s ease; }
.shop-check:hover { border-color:var(--green); transform:scale(1.1); }
.shop-priority-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:5px; }
.shop-info { flex:1; }
.shop-name { font-size:15px; font-weight:600; margin-bottom:4px; }
.shop-item.bought .shop-name { text-decoration:line-through; }
.shop-meta { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
.shop-notes { font-size:12px; color:var(--muted); font-style:italic; }

/* ================= LIBRARY ================= */
.lib-tabs { display:flex; gap:8px; margin-bottom:18px; }
.lib-tab { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 19px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; transition:all .15s ease; }
.lib-tab:hover { border-color:var(--primary); color:var(--text); }
.lib-tab.active { background:var(--navy); border-color:var(--navy); color:#F5F1E8; font-weight:600; }
html[data-theme="dark"] .lib-tab.active { background:var(--primary); border-color:var(--primary); color:#fff; }
.books-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; }
.book-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; transition:all .18s ease; position:relative; box-shadow:var(--shadow-sm); }
.book-card:hover { border-color:var(--primary); transform:translateY(-4px); box-shadow:var(--shadow-md); }
.book-cover { height:150px; display:flex; align-items:center; justify-content:center; }
.book-info { padding:15px; }
.book-title { font-family:var(--font-display); font-size:14px; font-weight:700; margin-bottom:4px; }
.book-author { font-size:12px; color:var(--muted); margin-bottom:9px; }
.book-del { position:absolute; top:9px; right:9px; background:rgba(16,24,40,.55); border:none; color:#fff; border-radius:50%; width:25px; height:25px; cursor:pointer; font-size:12px; opacity:0; transition:all .16s ease; z-index:2; }
.book-card:hover .book-del { opacity:1; }
.book-del:hover { background:var(--red); }

/* ================= HABITS / WORKOUTS ================= */
.workout-template { display:flex; align-items:center; justify-content:space-between; padding:13px 15px; background:var(--surface2); border-radius:var(--r-sm); margin-bottom:8px; }
.exercise-row { display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--border-soft); }
.ex-check { width:21px; height:21px; border-radius:50%; border:2px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; transition:all .16s ease; }
.ex-check:hover { border-color:var(--green); transform:scale(1.1); }
.ex-check.done { background:var(--green); border-color:var(--green); color:#fff; }
.exercise-form-row { display:flex; gap:6px; align-items:center; margin-bottom:8px; }

/* ================= UNDO TOAST ================= */
#undo-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); border:1px solid var(--border); border-radius:14px; padding:13px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-lg); z-index:9999; font-size:14px; color:#F5F1E8; }
#undo-toast.hidden { display:none; }
#undo-btn { background:var(--primary); color:#fff; border:none; border-radius:var(--r-sm); padding:7px 15px; cursor:pointer; font-weight:700; font-size:13px; transition:filter .15s ease; }
#undo-btn:hover { filter:brightness(1.1); }

/* ================= CRM / COMERCIAL ================= */
.crm-board { display:flex; gap:15px; overflow-x:auto; padding-bottom:14px; align-items:flex-start; }
.crm-col { flex:0 0 254px; background:var(--surface2); border-radius:var(--r-lg); padding:11px; min-height:120px; transition:background .15s ease; }
.crm-col.drag-over { background:var(--border); outline:2px dashed var(--primary); }
.crm-col-head { padding:7px 6px 11px; }
.crm-col-title { font-family:var(--font-display); font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; }
.crm-col-count { font-family:var(--font-mono); font-size:11px; padding:1px 8px; border-radius:100px; font-weight:700; }
.crm-col-total { font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:3px; }
.crm-col-body { display:flex; flex-direction:column; gap:8px; min-height:30px; }
.crm-card { background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px; cursor:grab; position:relative; transition:border-color .16s ease, transform .1s ease, box-shadow .16s ease; box-shadow:var(--shadow-sm); }
.crm-card:hover { border-color:var(--primary); box-shadow:var(--shadow-md); }
.crm-card:active { cursor:grabbing; transform:scale(.98); }
.crm-card-name { font-weight:600; font-size:13px; padding-right:16px; }
.crm-card-contact { font-size:11px; color:var(--muted); margin-top:3px; }
.crm-card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:6px; }
.crm-card-value { font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--green); }
.crm-card-origin { font-size:10px; color:var(--muted); background:var(--surface2); padding:2px 7px; border-radius:100px; }
.crm-card-del { position:absolute; top:7px; right:7px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:11px; opacity:0; transition:opacity .15s ease; }
.crm-card:hover .crm-card-del { opacity:1; }
.crm-card-del:hover { color:var(--red); }
.crm-empty { font-size:11px; color:var(--muted); text-align:center; padding:14px 0; opacity:.6; }
.crm-add-card { width:100%; margin-top:8px; background:none; border:1px dashed var(--border); color:var(--muted); border-radius:var(--r-sm); padding:7px; cursor:pointer; font-size:12px; transition:all .15s ease; }
.crm-add-card:hover { border-color:var(--primary); color:var(--primary); }
.funnel-row { margin-bottom:9px; }
.funnel-bar { height:28px; border-radius:8px; margin:0 auto; transition:width .5s cubic-bezier(.22,1,.36,1); min-width:40px; }
.funnel-label { display:flex; justify-content:space-between; font-size:12px; margin-top:3px; }
.funnel-label span { color:var(--muted); }
.conv-row { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border-soft); }
.conv-row:last-child { border-bottom:none; }

/* ================= INSIGHTS TAG CLOUD ================= */
.kn-tagcloud { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:11px; padding-bottom:11px; border-bottom:1px solid var(--border); }
.kn-tagchip { font-size:11px; background:rgba(66,178,221,.12); color:var(--primary-d); padding:3px 9px; border-radius:100px; cursor:pointer; transition:all .15s ease; }
.kn-tagchip:hover { background:var(--primary); color:#fff; }

/* ================= AGENDA: ROTINA + HÁBITOS ================= */
.routine-table { width:100%; border-collapse:collapse; min-width:640px; }
.routine-table th { font-family:var(--font-mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding:7px; text-align:left; }
.routine-table td { padding:3px; border-top:1px solid var(--border-soft); }
.routine-time { width:70px; font-family:var(--font-mono); font-weight:700; text-align:center; background:var(--surface2); }
.routine-cell { width:100%; min-width:80px; font-size:13px; background:transparent; border-color:transparent; }
.routine-cell:hover { border-color:var(--border); }
.routine-cell:focus { background:var(--surface2); border-color:var(--primary); }
.habit-table { border-collapse:collapse; min-width:100%; }
.habit-table th { font-family:var(--font-mono); font-size:10px; color:var(--muted); padding:5px; text-align:center; }
.habit-table td { padding:2px 4px; border-top:1px solid var(--border-soft); }
.habit-name-col { min-width:140px; text-align:left !important; position:sticky; left:0; background:var(--surface); z-index:1; }
.habit-name { width:130px; font-size:13px; background:transparent; border-color:transparent; }
.habit-name:focus { background:var(--surface2); border-color:var(--primary); }
.habit-day-col { width:26px; }
.habit-box { width:23px; height:23px; border-radius:7px; border:1.5px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin:0 auto; transition:all .15s ease; }
.habit-box:hover { border-color:var(--green); transform:scale(1.08); }
.habit-box.done { background:var(--green); border-color:var(--green); }

/* ================= DARK MODE — refinamentos ================= */
html[data-theme="dark"] body { background: var(--bg); }
html[data-theme="dark"] .char-page {
  background: linear-gradient(135deg, #1D2A45, #141E33);
  border-color: #2E3B57;
}
html[data-theme="dark"] .reward-balance-card {
  background: linear-gradient(120deg, rgba(232,106,140,.18), rgba(82,190,230,.14));
  border-color: rgba(232,106,140,.32);
}
html[data-theme="dark"] .streak-card {
  background: linear-gradient(120deg, rgba(232,106,140,.16), rgba(82,190,230,.1));
  border-color: rgba(232,106,140,.3);
}
html[data-theme="dark"] .levelup-card {
  background: linear-gradient(150deg, #1D2A45, #241B2C);
  border-color: var(--pink);
}
html[data-theme="dark"] .tier-node.current {
  background: linear-gradient(180deg, #1D2A45, #241B2C);
}
html[data-theme="dark"] .achievement.earned {
  background: linear-gradient(180deg, var(--surface), rgba(232,106,140,.1));
}
html[data-theme="dark"] .fin-stat-card.balance-pos .fsc-value,
html[data-theme="dark"] .badge-blue,
html[data-theme="dark"] .badge-purple { color: var(--primary-l); }
html[data-theme="dark"] #xp-toast,
html[data-theme="dark"] #undo-toast { background: #0E1626; }
html[data-theme="dark"] .levelup-card button { background: var(--primary); }

/* ================= THEME TOGGLE (additive) ================= */
#theme-toggle { width:100%; padding:10px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--muted); cursor:pointer; font-size:13px; font-weight:500; font-family:var(--font-body); transition:all .16s ease; display:flex; align-items:center; justify-content:center; gap:8px; }
#theme-toggle:hover { color:var(--text); border-color:var(--primary); background:var(--surface); }

/* ============================================================
   MOBILE / RESPONSIVO — <= 820px
   ============================================================ */
/* ============ TRILHA — sidebar indigo ============ */
#sidebar { background: linear-gradient(180deg, var(--surface), var(--bg)) !important; border-right: 1px solid var(--border) !important; }
#sidebar .nav-list li { color: var(--muted); }
#sidebar .nav-list li:hover { background: var(--surface2); color: var(--text); }
#sidebar .nav-list li.active { background: linear-gradient(120deg, rgba(124,131,255,.20), rgba(255,122,107,.14)); color: var(--text); box-shadow: none; }
#sidebar .nav-list li.active::before { background: var(--gold); }
#char-mini { border-bottom-color: var(--border); }
#sidebar .char-name { color: var(--text); }

  #modal-box { max-height: 86dvh; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }

  .section-header { flex-wrap: wrap; gap: 10px; }

    }

  function extractPdfText(raw) {
    const chunks = [];
    const re = /\(((?:[^()\\]|\\.)*)\)\s*Tj|\[((?:[^\]])*)\]\s*TJ/g;
    let m;
    while ((m = re.exec(raw))) {
      let s = m[1] != null ? m[1] : (m[2] || "").replace(/\([^)]*\)/g, (g) => g.slice(1, -1));
      s = s.replace(/\\([()\\])/g, "$1").replace(/\\(\d{3})/g, (_, o) => String.fromCharCode(parseInt(o, 8)));
      if (s.trim()) chunks.push(s);
    }
    return chunks.join("\n");
  }

    container.innerHTML = `

      const name = prompt("Nome da nova pasta:", ""); if (!name) return;

      renderEspiritual(container);
    };
    window._spRenameFolder = (id) => {
      const f = (storage_default.get("spiritual").folders || []).find((x) => x.id === id); if (!f) return;

  function renderSpEditor(folder, note, container) {
    const el = document.getElementById("sp-editor"); if (!el) return;
    if (!folder || !note) { el.innerHTML = `<div class="empty-state" style="margin-top:60px"><div class="empty-icon">\u271D\uFE0F</div>Selecione uma pasta e uma nota,<br>ou crie uma nova.</div>`; return; }

    el.innerHTML = `

      </div>
    </div>
    ${folder.kind === "devotional" ? `<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Registre: qual livro/cap\xEDtulo leu, sobre o que orou e o que Deus falou. Concluir o devocional do dia gera +15 XP Espiritual.</div>` : ""}
    ${richToolbarHTML("sp")}
    <div class="note-rich" id="sp-ed" contenteditable="true" data-placeholder="${folder.kind === "sermon" ? "Escreva seu esbo\xE7o, t\xF3picos, vers\xEDculos..." : "Escreva aqui..."}"></div>`;
    const titleEl = document.getElementById("sp-title");
    const save = () => {
      storage_default.update("spiritual", (s) => {
        const f = s.folders.find((x) => x.id === st.folderId); if (!f) return s;
        const n = f.notes.find((x) => x.id === note.id); if (!n) return s;
        n.title = titleEl.value; n.html = richGet("sp").innerHTML; n.updatedAt = Date.now();
        return s;
      });
    };
    titleEl.addEventListener("input", () => { clearTimeout(titleEl._t); titleEl._t = setTimeout(() => { save(); }, 350); });
    richWire("sp", note.html || "", save);
    window._spPresent = () => {
      const ed = richGet("sp");
      const html = (ed && ed.innerHTML) || note.html || "";
      const title = (document.getElementById("sp-title")?.value || note.title || "").trim();
      document.getElementById("sp-present")?.remove();
      let z = 1.7;
      const ov = document.createElement("div");
      ov.id = "sp-present";
      ov.style.cssText = "position:fixed;inset:0;z-index:600;background:var(--bg);color:var(--text);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(56px + env(safe-area-inset-top,0px)) 6vw calc(40px + env(safe-area-inset-bottom,0px))";
      ov.innerHTML = `
        <div style="position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;z-index:2">
          <button id="sp-pzless" class="btn btn-ghost btn-sm" title="Diminuir">A−</button>
          <button id="sp-pzmore" class="btn btn-ghost btn-sm" title="Aumentar">A+</button>
          <button id="sp-pclose" class="btn btn-primary btn-sm">✕ Sair</button>
        </div>
        ${title ? `<div style="max-width:920px;margin:0 auto;font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.01em;margin-bottom:18px">${esc(title)}</div>` : ""}
        <div id="sp-present-body" style="max-width:920px;margin:0 auto;font-family:var(--font-body);line-height:1.6;zoom:${z}">${html}</div>`;
      document.body.appendChild(ov);
      try { ov.requestFullscreen && ov.requestFullscreen(); } catch (e) {}
      try { if (window.matchMedia && window.screen && screen.orientation) {} } catch (e) {}
      const body = ov.querySelector("#sp-present-body");
      const setZ = (v) => { z = Math.max(1, Math.min(3.2, v)); body.style.zoom = z; };
      ov.querySelector("#sp-pzmore").onclick = () => setZ(z + 0.2);
      ov.querySelector("#sp-pzless").onclick = () => setZ(z - 0.2);
      const close = () => { try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {} ov.remove(); document.removeEventListener("keydown", onKey); };
      ov.querySelector("#sp-pclose").onclick = close;
      const onKey = (e) => { if (e.key === "Escape") close(); };
      document.addEventListener("keydown", onKey);
    };
    window._spDelNote = () => {
      const earned = folder.kind === "sermon" ? 20 : folder.kind === "devotional" ? (note.completions || []).length * 15 : 0;
      if (!askDelete(note.title || "nota", earned, "espiritual", note.id)) return;
      storage_default.update("spiritual", (s) => { const f = s.folders.find((x) => x.id === st.folderId); if (f) f.notes = f.notes.filter((x) => x.id !== note.id); return s; });
      st.noteId = null; renderEspiritual(container);
    };
    window._spToggleDevo = () => {
      const today = todayStr();
      let added = false;
      storage_default.update("spiritual", (s) => {
        const f = s.folders.find((x) => x.id === st.folderId); const n = f.notes.find((x) => x.id === note.id);

      else { addXP(-15, "espiritual"); }

    };

      return skip(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
    }});
    var nodes=[], n;
    while((n=tw.nextNode())) nodes.push(n);
    nodes.forEach(processText);
  }
  var obs, pending=false, queue=[];
  function flush(){
    pending=false;
    if(obs) obs.disconnect();
    try{
      var roots=queue; queue=[];
      for(var i=0;i<roots.length;i++){
        var r=roots[i];
        if(!r || !r.isConnected) continue;
        if(r.nodeType===3){ if(!skip(r)) processText(r); }
        else if(r.nodeType===1){ if(!skip(r)) walk(r); }
      }
    }catch(e){}
    if(obs) obs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  function schedule(){ if(pending) return; pending=true; setTimeout(flush,50); }
  function onMut(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      if(m.type==='characterData'){ if(m.target && !skip(m.target)) queue.push(m.target); }
      else if(m.addedNodes){
        for(var k=0;k<m.addedNodes.length;k++){ var an=m.addedNodes[k]; if(an && (an.nodeType===1||an.nodeType===3)) queue.push(an); }
      }
    }
    if(queue.length) schedule();
  }
  function start(){
    if(obs){ obs.disconnect(); } else { obs=new MutationObserver(onMut); }
    try{ walk(document.body); }catch(e){}
    obs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
  setTimeout(start,600);
})();
</script>
