<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>⚔️ RPG Life</title>
  <!-- PWA / instalável como app -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RPG Life">
  <!-- Google Identity Services (login p/ Google Calendar) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
:root {
  --bg: #0d0d14;
  --surface: #161621;
  --surface2: #1e1e2e;
  --border: #2a2a3e;
  --primary: #7c3aed;
  --primary-l: #a855f7;
  --gold: #f59e0b;
  --green: #10b981;
  --red: #ef4444;
  --blue: #3b82f6;
  --pink: #ec4899;
  --orange: #f97316;
  --text: #e2e8f0;
  --muted: #64748b;
  --sidebar-w: 220px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

#app {
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
#sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

.nav-list {
  list-style: none;
  padding: 8px;
  flex: 1;
}

.nav-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  color: var(--muted);
  transition: all .2s;
  margin-bottom: 2px;
}

.nav-list li:hover { background: var(--surface2); color: var(--text); }
.nav-list li.active { background: var(--primary); color: #fff; font-weight: 600; }

.sidebar-footer { padding: 12px; }
.sidebar-footer button {
  width: 100%;
  padding: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
}
.sidebar-footer button:hover { color: var(--text); }
#btn-reset { margin-top: 6px; }
#btn-reset:hover { color: var(--red); border-color: var(--red); }

/* MAIN */
#main-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.section { display: none; }
.section.active { display: block; }

/* CARDS */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 14px;
}

/* GRID */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }

/* BUTTONS */
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all .2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-l); }
.btn-gold { background: var(--gold); color: #000; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

/* INPUTS */
input, textarea, select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 12px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
  width: 100%;
}
input:focus, textarea:focus, select:focus { border-color: var(--primary); }
textarea { resize: vertical; min-height: 80px; }

label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }

.form-group { margin-bottom: 14px; }
.form-row { display: flex; gap: 10px; }
.form-row > * { flex: 1; }

/* MODAL */
#modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
#modal-overlay.hidden { display: none; }
#modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  min-width: 420px;
  max-width: 620px;
  width: 90%;
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
}
.modal-close {
  position: absolute; top: 14px; right: 14px;
  background: var(--surface2); border: none; color: var(--muted);
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px;
}
.modal-close:hover { color: var(--text); }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
.ev-title-input { font-size: 20px !important; font-weight: 600; padding: 8px 4px !important; border: none !important; border-bottom: 2px solid var(--border) !important; border-radius: 0 !important; background: transparent !important; }
.ev-title-input:focus { border-bottom-color: var(--primary) !important; outline: none; }
.ev-check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); margin: 4px 0 14px; cursor: pointer; }
.ev-check input { width: 16px; height: 16px; cursor: pointer; }

/* BADGES */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 100px;
  font-size: 11px; font-weight: 600;
}
.badge-purple { background: rgba(124,58,237,.2); color: var(--primary-l); }
.badge-gold { background: rgba(245,158,11,.2); color: var(--gold); }
.badge-green { background: rgba(16,185,129,.2); color: var(--green); }
.badge-red { background: rgba(239,68,68,.2); color: var(--red); }
.badge-blue { background: rgba(59,130,246,.2); color: var(--blue); }
.badge-pink { background: rgba(236,72,153,.2); color: var(--pink); }
.badge-orange { background: rgba(249,115,22,.2); color: var(--orange); }

/* TOAST */
#xp-toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface2); border: 1px solid var(--gold);
  border-radius: 10px; padding: 12px 18px;
  color: var(--gold); font-weight: 700; font-size: 15px;
  z-index: 200; animation: slideIn .3s ease;
}
#xp-toast.hidden { display: none; }
@keyframes slideIn { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }

/* LEVEL UP */
#levelup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 300;
}
#levelup-overlay.hidden { display: none; }
.levelup-card {
  text-align: center; padding: 40px;
  background: linear-gradient(135deg, #1e1e2e, #2d1b69);
  border: 2px solid var(--gold); border-radius: 20px;
}
.levelup-emoji { font-size: 64px; margin-bottom: 12px; animation: pulse 1s infinite; }
.levelup-title { font-size: 32px; font-weight: 900; color: var(--gold); letter-spacing: .1em; }
#levelup-msg { color: var(--muted); margin: 10px 0 24px; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* SECTION HEADERS */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.section-header h1 { font-size: 22px; font-weight: 700; }
.section-header h1 span { margin-right: 8px; }

/* EMPTY STATE */
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--muted);
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* TAG */
.tag {
  display: inline-block; padding: 2px 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 100px; font-size: 11px; color: var(--muted);
  cursor: pointer; margin: 2px;
}
.tag:hover { border-color: var(--primary); color: var(--primary-l); }

/* PRIORITY DOTS */
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-high { background: var(--red); }
.dot-med  { background: var(--gold); }
.dot-low  { background: var(--green); }

/* PAGE TITLE */
.page-title {
  font-size: 24px; font-weight: 800;
  background: linear-gradient(90deg, var(--primary-l), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.page-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }


/* CHARACTER CARD — SIDEBAR */
#char-mini {
  padding: 16px 12px;
  border-bottom: 1px solid var(--border);
}
.char-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin: 0 auto 8px;
  border: 2px solid var(--gold);
  box-shadow: 0 0 16px rgba(245,158,11,.3);
}
.char-name {
  font-weight: 700; font-size: 13px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.char-class-badge {
  text-align: center; font-size: 11px; color: var(--gold);
  margin: 2px 0 8px;
}
.char-xp-bar-wrap {
  background: var(--surface2); border-radius: 4px; height: 6px;
  margin-bottom: 4px; overflow: hidden;
}
.char-xp-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--gold));
  border-radius: 4px; transition: width .5s ease;
}
.char-xp-text { font-size: 10px; color: var(--muted); text-align: center; }

/* CHARACTER PAGE (Dashboard) */
.char-page {
  background: linear-gradient(135deg, #161621, #1a1030);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  display: flex;
  gap: 24px;
  align-items: flex-start;
  margin-bottom: 16px;
}
.char-left { flex-shrink: 0; text-align: center; }
.char-big-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--gold));
  display: flex; align-items: center; justify-content: center;
  font-size: 52px; margin: 0 auto 10px;
  border: 3px solid var(--gold);
  box-shadow: 0 0 32px rgba(245,158,11,.4);
  animation: glow 3s infinite;
}
@keyframes glow {
  0%,100% { box-shadow: 0 0 20px rgba(245,158,11,.4); }
  50% { box-shadow: 0 0 40px rgba(245,158,11,.7); }
}
.char-level-badge {
  display: inline-block; background: var(--gold); color: #000;
  font-weight: 900; font-size: 13px; padding: 2px 10px;
  border-radius: 100px; margin-bottom: 4px;
}
.char-class-name { font-size: 18px; font-weight: 700; color: var(--primary-l); }
.char-title-text { color: var(--muted); font-size: 13px; }

.char-right { flex: 1; }
.char-name-input {
  font-size: 20px; font-weight: 700; background: transparent;
  border: none; border-bottom: 1px solid var(--border);
  border-radius: 0; color: var(--text); padding: 2px 0;
  margin-bottom: 12px; width: 100%;
}
.char-name-input:focus { border-bottom-color: var(--primary); }

.char-total-xp { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.char-total-xp b { color: var(--gold); }

.xp-progress-wrap {
  margin-bottom: 16px;
}
.xp-progress-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--muted); margin-bottom: 4px;
}
.xp-bar-outer {
  background: var(--surface2); border-radius: 100px; height: 10px; overflow: hidden;
}
.xp-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--gold));
  border-radius: 100px; transition: width .5s ease;
}

/* ATTRIBUTE STATS */
.attrs-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.attr-row {
  display: flex; align-items: center; gap: 8px;
}
.attr-icon { font-size: 18px; flex-shrink: 0; }
.attr-info { flex: 1; }
.attr-name { font-size: 11px; color: var(--muted); }
.attr-level { font-size: 13px; font-weight: 700; }
.attr-bar-outer {
  background: var(--surface2); border-radius: 100px; height: 4px; margin-top: 2px; overflow: hidden;
}
.attr-bar-inner {
  height: 100%; border-radius: 100px; transition: width .5s ease;
}

/* ACHIEVEMENTS */
.achievements-grid {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.achievement {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 12px; text-align: center;
  min-width: 80px;
}
.achievement.earned { border-color: var(--gold); }
.achievement .ach-icon { font-size: 24px; }
.achievement .ach-name { font-size: 11px; color: var(--muted); margin-top: 4px; }
.achievement.earned .ach-name { color: var(--gold); }
.achievement.locked { opacity: .4; filter: grayscale(1); }

/* STREAK */
.streak-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3);
  border-radius: 10px; margin-bottom: 12px;
}
.streak-fire { font-size: 28px; }
.streak-count { font-size: 24px; font-weight: 900; color: var(--gold); }
.streak-label { font-size: 12px; color: var(--muted); }

/* TASK ITEM (gamified) */
.task-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 8px;
  transition: all .2s; cursor: default;
}
.task-item:hover { border-color: var(--primary); }
.task-item.done { opacity: .5; }
.task-item.done .task-name { text-decoration: line-through; color: var(--muted); }
.task-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border); cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all .2s; font-size: 12px;
}
.task-check:hover { border-color: var(--primary); }
.task-item.done .task-check { background: var(--green); border-color: var(--green); }
.task-name { flex: 1; font-size: 14px; }
.task-xp { font-size: 12px; font-weight: 700; color: var(--gold); }
.task-attr { font-size: 16px; }
.task-delete {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 14px; opacity: 0; transition: opacity .2s;
}
.task-item:hover .task-delete { opacity: 1; }


/* ========== CALENDAR ========== */
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px; }
.cal-header { font-size:11px; font-weight:600; color:var(--muted); text-align:center; padding:4px; }
.cal-day { aspect-ratio:1; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:13px; background:var(--surface2); transition:all .2s; position:relative; }
.cal-day:hover { background:var(--border); }
.cal-day.today { background:var(--primary); color:#fff; font-weight:700; }
.cal-day.other-month { opacity:.35; }
.cal-day.has-event::after { content:''; position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:var(--gold); }
.cal-day.selected { border:2px solid var(--gold); }
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-nav button { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:4px 12px; cursor:pointer; }
.event-item { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface2); border-radius:8px; margin-bottom:6px; border-left:3px solid var(--primary); }
.event-time { font-size:12px; color:var(--muted); min-width:50px; }
.event-delete { background:none; border:none; color:var(--muted); cursor:pointer; margin-left:auto; }

/* ========== NOTES DUAL PANEL ========== */
.notes-topbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.notes-topbar-label { color:var(--muted); font-size:13px; font-weight:600; flex-shrink:0; }
.notes-date-select {
  flex:1; max-width:360px; padding:12px 14px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  color:var(--text); font-size:15px; font-weight:600; cursor:pointer;
}
.notes-date-select:focus { outline:none; border-color:var(--primary); }
.notes-date-del-btn {
  flex-shrink:0; width:44px; height:44px; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; color:var(--muted); cursor:pointer; font-size:16px;
}
.notes-date-del-btn:hover { color:var(--red); border-color:var(--red); }
.notes-right { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.notes-panel { display:flex; flex-direction:column; overflow:hidden; }
#notes-checklist-panel { max-height:260px; overflow-y:auto; }
.note-date-item { padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--muted); transition:all .2s; margin-bottom:4px; border-left:3px solid transparent; }
.note-date-item:hover { background:var(--surface2); color:var(--text); }
.note-date-item.active { border-left-color:var(--primary); background:var(--surface2); color:var(--text); }
.note-preview { font-size:11px; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.note-mood { display:flex; gap:4px; }
.mood-btn { font-size:18px; background:none; border:2px solid transparent; border-radius:6px; cursor:pointer; padding:2px; transition:all .2s; }
.mood-btn.selected { border-color:var(--gold); background:rgba(245,158,11,.1); }
.note-toolbar { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
.note-toolbar button { background:var(--surface2); border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:3px 8px; font-size:12px; cursor:pointer; }
.note-toolbar button:hover { color:var(--text); border-color:var(--primary); }
.note-textarea { flex:1; font-family:'Consolas',monospace; font-size:14px; line-height:1.7; min-height:150px; }

/* CHECKLIST */
.checklist-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; margin-bottom:4px; background:var(--surface2); transition:all .2s; }
.checklist-item.done { opacity:.6; }
.checklist-item.done .checklist-text { text-decoration:line-through; color:var(--muted); }
.checklist-check { width:20px; height:20px; border-radius:50%; border:2px solid var(--border); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; transition:all .2s; }
.checklist-check:hover { border-color:var(--green); }
.checklist-check.done { background:var(--green); border-color:var(--green); color:#fff; }
.checklist-text { flex:1; font-size:14px; }
.checklist-del { background:none; border:none; color:var(--muted); cursor:pointer; opacity:.5; transition:opacity .2s; }
.checklist-item:hover .checklist-del { opacity:1; }
.checklist-del:hover { color:var(--red); opacity:1; }
.note-date-del { position:absolute; top:6px; right:6px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; opacity:.5; }
.note-date-del:hover { color:var(--red); opacity:1; }
.note-date-item { position:relative; }
.note-date-item.has-content { border-left-color:var(--gold); }
.checklist-add { display:flex; gap:6px; margin-top:8px; }

/* ========== OBJETIVOS ========== */
.journey-board { display:flex; gap:16px; overflow-x:auto; padding-bottom:12px; }
.journey-col { flex-shrink:0; width:260px; background:var(--surface2); border-radius:12px; padding:14px; transition:background .15s; }
.journey-col.drag-over { background:var(--border); outline:2px dashed var(--primary); }
.objective-card[draggable="true"] { cursor:grab; }
.objective-card:active { cursor:grabbing; }
.journey-col-title { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.objective-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:8px; cursor:pointer; transition:all .2s; }
.objective-card:hover { border-color:var(--primary); transform:translateY(-2px); }
.obj-title { font-size:14px; font-weight:600; margin-bottom:6px; }
.obj-progress-bar { background:var(--surface2); border-radius:4px; height:4px; overflow:hidden; }
.obj-progress-fill { height:100%; border-radius:4px; background:var(--primary); transition:width .4s; }
.obj-stats { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px; }
.milestone-item { display:flex; align-items:center; gap:6px; padding:4px 0; font-size:12px; color:var(--muted); border-bottom:1px solid var(--border); }
.milestone-item:last-child { border-bottom:none; }
.milestone-check { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--border); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:9px; }
.milestone-check.done { background:var(--green); border-color:var(--green); color:#fff; }

/* ========== KNOWLEDGE/INSIGHTS ========== */
.knowledge-layout { display:grid; grid-template-columns:240px 1fr; gap:16px; height:calc(100vh - 120px); }
.knowledge-sidebar { overflow-y:auto; }
.knowledge-note-item { padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; transition:all .2s; margin-bottom:4px; }
.knowledge-note-item:hover { background:var(--surface2); }
.knowledge-note-item.active { background:var(--surface2); border-left:3px solid var(--primary); }
.knowledge-note-item .kn-title { font-weight:600; }
.knowledge-note-item .kn-tags { font-size:11px; color:var(--muted); margin-top:2px; }
.knowledge-editor-title { font-size:20px; font-weight:700; background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0; color:var(--text); padding:4px 0; margin-bottom:10px; width:100%; }
.knowledge-editor-title:focus { border-bottom-color:var(--primary); }
.knowledge-textarea { flex:1; font-family:'Consolas',monospace; font-size:14px; line-height:1.7; min-height:200px; }
.knowledge-rendered { flex:1; min-height:200px; line-height:1.7; font-size:14px; overflow-y:auto; padding:8px; }
.knowledge-rendered .wiki-link { color:var(--primary-l); cursor:pointer; text-decoration:underline; }
#knowledge-graph-canvas { width:100%; height:220px; border-radius:12px; background:var(--surface2); border:1px solid var(--border); margin-top:12px; display:block; }
.backlinks { margin-top:16px; }
.backlinks-title { font-size:12px; color:var(--muted); margin-bottom:8px; font-weight:600; }
.backlink-item { font-size:12px; color:var(--primary-l); cursor:pointer; padding:4px 8px; border-radius:6px; display:inline-block; margin:2px; background:rgba(168,85,247,.1); }

/* ========== FINANCE ========== */
.fin-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.fin-tab { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 14px; font-size:13px; color:var(--muted); cursor:pointer; transition:all .2s; }
.fin-tab:hover { color:var(--text); }
.fin-tab.active { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }

.fin-summary-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:16px; }
.fin-stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; }
.fsc-label { font-size:11px; color:var(--muted); margin-bottom:4px; }
.fsc-value { font-size:18px; font-weight:700; }
.fin-stat-card.income .fsc-value { color:var(--green); }
.fin-stat-card.expense .fsc-value { color:var(--red); }
.fin-stat-card.balance-pos .fsc-value { color:var(--gold); }
.fin-stat-card.balance-neg .fsc-value { color:var(--red); }
.fin-stat-card.paid .fsc-value { color:var(--green); }
.fin-stat-card.overdue .fsc-value { color:var(--red); }

.tx-row { display:flex; align-items:center; gap:10px; padding:10px; background:var(--surface2); border-radius:8px; margin-bottom:6px; }
.tx-icon-box { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.tx-name { font-size:14px; font-weight:500; }
.tx-cat { font-size:11px; color:var(--muted); }
.tx-amount { font-weight:700; font-size:14px; white-space:nowrap; }
.tx-amount.income { color:var(--green); }
.tx-amount.expense { color:var(--red); }
.tx-del, .tx-edit { background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; opacity:.55; transition:opacity .2s; font-size:13px; }
.tx-row:hover .tx-del, .tx-row:hover .tx-edit, .fix-row:hover .tx-del, .fix-row:hover .tx-edit { opacity:1; }
.tx-del:hover { color:var(--red); opacity:1; }
.tx-edit:hover { color:var(--primary-l); opacity:1; }

/* rodapé de somas das despesas */
.fin-totals-bar { position:sticky; bottom:0; display:flex; flex-wrap:wrap; gap:18px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 18px; margin-top:12px; box-shadow:0 -4px 16px rgba(0,0,0,.25); }
.fin-total-item { display:flex; align-items:center; gap:6px; font-size:14px; }
.fin-total-item b { font-size:15px; }
.fin-total-label { color:var(--muted); font-size:12px; }
.fin-total-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }

.fin-table { width:100%; border-collapse:collapse; }
.fin-table th { font-size:11px; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
.fin-table td { padding:10px; border-bottom:1px solid var(--border); font-size:13px; }
.fin-table tr:last-child td { border-bottom:none; }
.fix-row.status-paid td { opacity:.6; }
.fix-row.status-overdue { background:rgba(239,68,68,.04); }
.cat-pill { background:var(--surface2); border:1px solid var(--border); border-radius:100px; padding:2px 8px; font-size:11px; }
.status-sel { font-size:12px; padding:2px 4px; border-radius:6px; }
.fixed-status-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }

.fin-upcoming { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.fin-upcoming:last-child { border-bottom:none; }
.fin-upcoming-name { flex:1; font-size:13px; }
.fin-upcoming-date { font-size:12px; color:var(--muted); }
.fin-upcoming-val { font-size:13px; font-weight:600; }

.fin-card-mini { padding:10px 14px; background:var(--surface2); border-radius:10px; margin-bottom:8px; }

.debt-card, .saving-card { background:var(--surface2); border-radius:12px; padding:16px; margin-bottom:12px; }

.cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.credit-card { border-radius:16px; padding:18px; min-height:130px; position:relative; font-family:'Segoe UI',sans-serif; box-shadow:0 8px 24px rgba(0,0,0,.3); }
.cc-bank { font-size:20px; font-weight:900; letter-spacing:.05em; opacity:.9; }
.cc-number { font-size:16px; letter-spacing:.15em; margin:10px 0 6px; font-family:monospace; }
.cc-name { font-size:12px; opacity:.8; margin-bottom:6px; }
.cc-details { display:flex; gap:10px; font-size:11px; opacity:.8; }
.cc-limit { font-size:12px; opacity:.7; margin-top:4px; }

/* ========== REWARDS ========== */
.reward-balance-card { display:flex; align-items:center; gap:16px; padding:16px 20px; background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(124,58,237,.15)); border:1px solid rgba(245,158,11,.3); border-radius:14px; margin-bottom:20px; }
.reward-balance-icon { font-size:36px; }
.reward-balance-value { font-size:24px; font-weight:800; color:var(--gold); }
.reward-balance-sub { font-size:12px; color:var(--muted); }
.rewards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.reward-card { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; position:relative; transition:all .2s; }
.reward-card:hover:not(.cant-afford) { border-color:var(--gold); transform:translateY(-2px); }
.reward-card.cant-afford { opacity:.5; }
.reward-icon { font-size:36px; margin-bottom:8px; }
.reward-name { font-size:13px; font-weight:600; margin-bottom:6px; }
.reward-cost { font-size:12px; color:var(--gold); margin-bottom:10px; font-weight:700; }
.reward-del { position:absolute; top:6px; right:6px; background:none; border:none; color:var(--muted); cursor:pointer; opacity:0; font-size:12px; }
.reward-card:hover .reward-del { opacity:1; }
.history-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.history-item:last-child { border-bottom:none; }

/* ========== SHOPPING ========== */
.shop-filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.shop-filter { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 14px; font-size:13px; color:var(--muted); cursor:pointer; transition:all .2s; }
.shop-filter:hover, .shop-filter.active { border-color:var(--primary); color:var(--primary-l); }
.shop-stats { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:12px; padding:8px 12px; background:var(--surface); border-radius:8px; }
.shop-item { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; transition:all .2s; }
.shop-item:hover { border-color:var(--primary); }
.shop-item.bought { opacity:.5; }
.shop-check { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; margin-top:1px; transition:all .2s; }
.shop-check:hover { border-color:var(--green); }
.shop-priority-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:5px; }
.shop-info { flex:1; }
.shop-name { font-size:15px; font-weight:600; margin-bottom:4px; }
.shop-item.bought .shop-name { text-decoration:line-through; }
.shop-meta { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
.shop-notes { font-size:12px; color:var(--muted); font-style:italic; }

/* ========== LIBRARY ========== */
.lib-tabs { display:flex; gap:8px; margin-bottom:16px; }
.lib-tab { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 18px; font-size:13px; color:var(--muted); cursor:pointer; transition:all .2s; }
.lib-tab.active { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }
.books-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
.book-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; transition:all .2s; position:relative; }
.book-card:hover { border-color:var(--primary); transform:translateY(-3px); }
.book-cover { height:140px; display:flex; align-items:center; justify-content:center; }
.book-info { padding:14px; }
.book-title { font-size:14px; font-weight:700; margin-bottom:4px; }
.book-author { font-size:12px; color:var(--muted); margin-bottom:8px; }
.book-del { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.55); border:none; color:#fff; border-radius:50%; width:24px; height:24px; cursor:pointer; font-size:12px; opacity:.7; transition:all .2s; z-index:2; }
.book-card:hover .book-del { opacity:1; }
.book-del:hover { background:var(--red); }

/* ========== HABITS ========== */
.workout-template { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--surface2); border-radius:10px; margin-bottom:8px; }
.exercise-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.ex-check { width:20px; height:20px; border-radius:50%; border:2px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; transition:all .2s; }
.ex-check.done { background:var(--green); border-color:var(--green); color:#fff; }
.exercise-form-row { display:flex; gap:6px; align-items:center; margin-bottom:8px; }

/* ========== RPG SIDEBAR ========== */
.char-avatar-mini { width:52px; height:52px; border-radius:50%; overflow:hidden; margin:0 auto 8px; border:2px solid var(--gold); box-shadow:0 0 12px rgba(245,158,11,.3); display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--primary),var(--gold)); }
.char-name { font-weight:700; font-size:13px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.char-class-badge { text-align:center; font-size:11px; color:var(--gold); margin:2px 0 8px; }
.char-xp-bar-wrap { background:var(--surface2); border-radius:4px; height:5px; margin-bottom:3px; overflow:hidden; }
.char-xp-bar { height:100%; background:linear-gradient(90deg,var(--primary),var(--gold)); border-radius:4px; transition:width .5s ease; }
.char-xp-text { font-size:10px; color:var(--muted); text-align:center; }

/* ========== UNDO TOAST ========== */
#undo-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:14px; box-shadow:0 8px 28px rgba(0,0,0,.5); z-index:9999; font-size:14px; }
#undo-toast.hidden { display:none; }
#undo-btn { background:var(--primary); color:#fff; border:none; border-radius:8px; padding:6px 14px; cursor:pointer; font-weight:600; font-size:13px; }
#undo-btn:hover { filter:brightness(1.1); }

/* ========== CRM / COMERCIAL ========== */
.crm-board { display:flex; gap:14px; overflow-x:auto; padding-bottom:14px; align-items:flex-start; }
.crm-col { flex:0 0 250px; background:var(--surface2); border-radius:12px; padding:10px; min-height:120px; transition:background .15s; }
.crm-col.drag-over { background:var(--border); outline:2px dashed var(--primary); }
.crm-col-head { padding:6px 6px 10px; }
.crm-col-title { font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; }
.crm-col-count { font-size:11px; padding:1px 8px; border-radius:100px; font-weight:700; }
.crm-col-total { font-size:11px; color:var(--muted); margin-top:2px; }
.crm-col-body { display:flex; flex-direction:column; gap:8px; min-height:30px; }
.crm-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; cursor:grab; position:relative; transition:border-color .2s, transform .1s; }
.crm-card:hover { border-color:var(--primary); }
.crm-card:active { cursor:grabbing; transform:scale(.98); }
.crm-card-name { font-weight:600; font-size:13px; padding-right:16px; }
.crm-card-contact { font-size:11px; color:var(--muted); margin-top:3px; }
.crm-card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:6px; gap:6px; }
.crm-card-value { font-size:12px; font-weight:700; color:var(--green); }
.crm-card-origin { font-size:10px; color:var(--muted); background:var(--surface2); padding:1px 6px; border-radius:100px; }
.crm-card-del { position:absolute; top:6px; right:6px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:11px; opacity:0; transition:opacity .2s; }
.crm-card:hover .crm-card-del { opacity:1; }
.crm-card-del:hover { color:var(--red); }
.crm-empty { font-size:11px; color:var(--muted); text-align:center; padding:14px 0; opacity:.6; }
.crm-add-card { width:100%; margin-top:8px; background:none; border:1px dashed var(--border); color:var(--muted); border-radius:8px; padding:6px; cursor:pointer; font-size:12px; transition:all .2s; }
.crm-add-card:hover { border-color:var(--primary); color:var(--primary-l); }

/* Funil do dashboard comercial */
.funnel-row { margin-bottom:8px; }
.funnel-bar { height:26px; border-radius:6px; margin:0 auto; transition:width .4s; min-width:40px; }
.funnel-label { display:flex; justify-content:space-between; font-size:12px; margin-top:2px; }
.funnel-label span { color:var(--muted); }
.conv-row { display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px solid var(--border); }
.conv-row:last-child { border-bottom:none; }

/* nuvem de tags nos Insights */
.kn-tagcloud { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.kn-tagchip { font-size:11px; background:rgba(168,85,247,.12); color:var(--primary-l); padding:2px 8px; border-radius:100px; cursor:pointer; transition:all .2s; }
.kn-tagchip:hover { background:var(--primary); color:#fff; }
/* seletor de perfil em Finanças */
.fin-profile-sel { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 10px; font-size:13px; font-weight:600; cursor:pointer; max-width:170px; }

/* ========== AGENDA: ROTINA + HÁBITOS ========== */
.routine-table { width:100%; border-collapse:collapse; min-width:640px; }
.routine-table th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; padding:6px; text-align:left; }
.routine-table td { padding:3px; border-top:1px solid var(--border); }
.routine-time { width:70px; font-weight:700; text-align:center; background:var(--surface2); }
.routine-cell { width:100%; min-width:80px; font-size:13px; background:transparent; border-color:transparent; }
.routine-cell:hover { border-color:var(--border); }
.routine-cell:focus { background:var(--surface2); border-color:var(--primary); }

.habit-table { border-collapse:collapse; min-width:100%; }
.habit-table th { font-size:11px; color:var(--muted); padding:4px; text-align:center; }
.habit-table td { padding:2px 4px; border-top:1px solid var(--border); }
.habit-name-col { min-width:140px; text-align:left !important; position:sticky; left:0; background:var(--surface); z-index:1; }
.habit-name { width:130px; font-size:13px; background:transparent; border-color:transparent; }
.habit-name:focus { background:var(--surface2); border-color:var(--primary); }
.habit-day-col { width:26px; }
.habit-box { width:22px; height:22px; border-radius:6px; border:1.5px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin:0 auto; transition:all .15s; }
.habit-box:hover { border-color:var(--green); }
.habit-box.done { background:var(--green); border-color:var(--green); }


/* ============================================================
   MOBILE / RESPONSIVO — só afeta telas <= 820px
   ============================================================ */
#mobile-menu-btn { display: none; }
#sidebar-backdrop { display: none; }

@media (max-width: 820px) {
  body { overflow: auto; }
  #app { flex-direction: column; height: auto; min-height: 100vh; }

  /* botão hamburger fixo no topo */
  #mobile-menu-btn {
    display: flex; align-items: center; justify-content: center;
    position: fixed; top: 10px; left: 10px; z-index: 60;
    width: 44px; height: 44px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 22px; cursor: pointer;
  }

  /* sidebar vira gaveta deslizante da esquerda */
  #sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 82%; max-width: 300px; height: 100vh; z-index: 70;
    transform: translateX(-100%); transition: transform .25s ease;
    box-shadow: 2px 0 16px rgba(0,0,0,.55);
  }
  #sidebar.open { transform: translateX(0); }

  #sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 65; }
  #sidebar-backdrop.show { display: block; }

  /* alvos de toque maiores */
  .nav-list li { padding: 14px 16px; font-size: 15px; }
  .sidebar-footer button { padding: 12px; font-size: 14px; }

  /* conteúdo ocupa a largura toda, com espaço pro botão do topo */
  #main-content { height: auto; overflow-y: visible; padding: 62px 14px 40px; }

  .section-header { flex-wrap: wrap; gap: 10px; }
  .section-header h1 { font-size: 19px; }

  /* abas e tabelas roláveis em vez de espremidas */
  .fin-tabs, .lib-tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  table { display: block; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }

  /* modal cabe na tela do celular */
  #modal-box { min-width: 0; width: 92%; padding: 20px; max-height: 88vh; }

  /* grids empilham no celular pra não vazar da tela */
  .grid-3, .grid-2, .attrs-grid { grid-template-columns: 1fr; }
  .fin-summary-grid { grid-template-columns: 1fr 1fr; }
  .notes-layout, .knowledge-layout, .notes-right { grid-template-columns: 1fr; height: auto; }
  .cards-grid, .rewards-grid, .books-grid { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
  <div id="app">
    <button id="mobile-menu-btn" onclick="window._toggleSidebar()" aria-label="Abrir menu">☰</button>
    <div id="sidebar-backdrop" onclick="window._closeSidebar()"></div>
    <nav id="sidebar">
      <div id="char-mini"></div>
      <ul class="nav-list">
        <li data-section="dashboard"     class="active"><span>🏠</span> Dashboard</li>
        <li data-section="personagem">   <span>⚔️</span> Personagem</li>
        <li data-section="agenda">       <span>📅</span> Agenda</li>
        <li data-section="notas">        <span>📝</span> Notas Diárias</li>
        <li data-section="objetivos">    <span>🎯</span> Objetivos</li>
        <li data-section="insights">     <span>🧠</span> Insights</li>
        <li data-section="financas">     <span>💰</span> Finanças</li>
        <li data-section="comercial">    <span>📊</span> Comercial</li>
        <li data-section="treinos">      <span>💪</span> Treinos</li>
        <li data-section="biblioteca">   <span>📚</span> Biblioteca</li>
        <li data-section="compras">      <span>🛒</span> Compras</li>
        <li data-section="recompensas">  <span>🏆</span> Recompensas</li>
      </ul>
      <div class="sidebar-footer">
        <button id="btn-sync" onclick="window._sidebarSync()">🔄 Atualizar</button>
        <button id="btn-settings" onclick="openSettings()">⚙️ Config</button>
        <button id="btn-reset" onclick="window._resetAll()">🗑️ Resetar Tudo</button>
      </div>
    </nav>

    <main id="main-content">

  function bindSavingsUpdates() {
    window._payDebt = (id) => {
      const inp = document.getElementById(`debt-pay-${id}`);
      const amount = parseFloat(inp?.value);
      if (!amount) return;
      storage_default.update("finance", (f) => {
        const d = f.debts.find((x) => x.id === id);
        if (d) d.paid = Math.min(d.total, (d.paid || 0) + amount);
        return f;
      });
      renderFinContent();
    };
    window._updateGoalProgress = (id) => {
      const inp = document.getElementById(`sav-add-${id}`);
      const amount = parseFloat(inp?.value);
      if (!amount) return;
      let reachedGoal = false;
      storage_default.update("finance", (f) => {
        const s = f.savings.find((x) => x.id === id);
        if (s) {
          s.current = Math.min(s.target, (s.current || 0) + amount);
          addXP(15, "riqueza");
          if (s.target && s.current >= s.target && !s.rewarded) {
            s.rewarded = true;
            reachedGoal = true;
          }
        }
        return f;
      });
      if (reachedGoal) {
        addXP(120, "riqueza");
        const t = document.getElementById("xp-toast");
        if (t) {
          t.textContent = "\u{1F48E} Meta de economia atingida! +120 XP";
          t.classList.remove("hidden");
          clearTimeout(t._timer);
          t._timer = setTimeout(() => t.classList.add("hidden"), 3e3);
        }
      }
      renderFinContent();
    };
  }
  function updateFixedStatuses(items) {
    const today = todayISO();
    items.forEach((x) => {
      if (x.status === "paid") return;
      const due = x.date || (x.dueDay ? `${activeMonth}-${pad(x.dueDay)}` : null);
      if (!due) return;
      x.status = due < today ? "overdue" : "topay";
    });
  }
  function toggleFixedStatus(id, status) {
    storage_default.update("finance", (f) => {
      const x = f.fixedExpenses.find((x2) => x2.id === id);

        if (status === "paid") addXP(10, "riqueza");
      }
      return f;
    });
    renderFinContent();
  }

      if (type === "fixed") f.fixedExpenses = f.fixedExpenses.filter((x) => x.id !== id);
      if (type === "variable") f.variableExpenses = f.variableExpenses.filter((x) => x.id !== id);
      if (type === "debt") f.debts = f.debts.filter((x) => x.id !== id);
      if (type === "saving") f.savings = f.savings.filter((x) => x.id !== id);
      if (type === "card") f.creditCards = f.creditCards.filter((x) => x.id !== id);
      return f;
    });
    renderFinContent();
  }

      renderCharMini();
      openSettings();
    };
    const readTheme = () => ({ primary: document.getElementById("th-primary").value, gold: document.getElementById("th-gold").value, bg: document.getElementById("th-bg").value });
    window._previewTheme = () => {
      const t = readTheme();
      const r = document.documentElement.style;
      r.setProperty("--primary", t.primary);
      r.setProperty("--primary-l", lightenHex(t.primary, 40));
      r.setProperty("--gold", t.gold);
      r.setProperty("--bg", t.bg);
    };
    window._resetTheme = () => {
      document.getElementById("th-primary").value = THEME_DEFAULTS.primary;
      document.getElementById("th-gold").value = THEME_DEFAULTS.gold;
      document.getElementById("th-bg").value = THEME_DEFAULTS.bg;
      storage_default.update("settings", (s) => ({ ...s, themeColors: null }));
      applyTheme();
    };
    const syncMsg = (m, ok) => {
      const el = document.getElementById("sync-status");
      if (el) {
        el.textContent = m;
        el.style.color = ok ? "var(--green)" : "var(--red)";
      }
    };
    const readSyncForm = () => ({ url: document.getElementById("sync-url").value.trim(), key: document.getElementById("sync-key").value.trim(), code: document.getElementById("sync-code").value.trim(), auto: document.getElementById("sync-auto").checked, lastSync: getSyncCfg().lastSync });
    window._syncSave = () => {
      setSyncCfg(readSyncForm());
      syncMsg("Config salva \u2705", true);
    };
    window._syncTest = async () => {
      syncMsg("Testando...", true);
      const r = await testConnection(readSyncForm());
      syncMsg(r.msg, r.ok);
    };
    window._syncNow = async () => {
      setSyncCfg(readSyncForm());
      if (!syncConfigured()) {
        syncMsg("Preencha URL, chave e c\xF3digo.", false);
        return;
      }
      syncMsg("Sincronizando...", true);
      const r = await syncNow();
      syncMsg(r.msg, r.ok);
      if (r.ok && r.changed) setTimeout(() => location.reload(), 800);
    };
    window._saveSettings = () => {
      const name = document.getElementById("set-name").value.trim();
      if (name) storage_default.update("character", (c) => {
        c.name = name;
        return c;
      });
      storage_default.update("settings", (s) => ({ ...s, googleClientId: document.getElementById("set-gcal").value.trim(), themeColors: readTheme() }));
      applyTheme();
      renderCharMini();
      window._closeModal();
      if (currentSection === "dashboard") renderDashboard2();
    };
  };
  function renderPersonagem(container) {
    const char = storage_default.get("character");
    const tier = getTier(char.level);
    const p = progress(char.totalXP);
    const svg = getAvatarSVG(char.level, 120);
    container.innerHTML = `
    <div class="section-header"><h1><span>\u2694\uFE0F</span> Personagem</h1></div>
    <div class="char-page">
      <div class="char-left">
        <div class="char-big-avatar">${svg}</div>
        <div style="text-align:center;font-weight:700;font-size:16px;margin-top:6px">${char.name}</div>
        <div class="char-level-badge">Nv ${char.level}</div><br>
        <div class="char-class-name">${tier.emoji} ${tier.name}</div>
        <div class="char-title-text">"${tier.title}"</div>
        <div style="margin-top:12px;font-size:22px">\u{1FA99} ${char.coins || 0} moedas</div>
      </div>
      <div class="char-right">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">\u270F\uFE0F Seu nome</label>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input class="char-name-input" id="char-name-field" value="${char.name}" placeholder="Digite seu nome" style="margin:0"
            onkeydown="if(event.key==='Enter')window._setCharName()">
          <button class="btn btn-primary btn-sm" onclick="window._setCharName()">Salvar</button>
        </div>
        <div class="char-total-xp">XP Total: <b>${char.totalXP}</b></div>
        <div class="xp-progress-wrap">
          <div class="xp-progress-label"><span>Progresso \u2192 N\xEDvel ${char.level + 1}</span><span>${p.current}/${p.needed} XP</span></div>
          <div class="xp-bar-outer"><div class="xp-bar-inner" style="width:${p.pct}%"></div></div>
        </div>
        <div class="attrs-grid">
          ${Object.entries(ATTRS).map(([k, a]) => {
      const attr = char.attrs[k];
      const ap = progress(attr.xp);
      return `<div class="attr-row">
              <span class="attr-icon">${a.emoji}</span>
              <div class="attr-info">
                <div style="display:flex;justify-content:space-between">
                  <span class="attr-name">${a.name}</span>
                  <span class="attr-level" style="color:${a.color}">Nv ${attr.level}</span>
                </div>
                <div class="attr-bar-outer"><div class="attr-bar-inner" style="width:${ap.pct}%;background:${a.color}"></div></div>
              </div>
            </div>`;
    }).join("")}
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">\u{1F3C6} Conquistas</div>
      <div class="achievements-grid">
        ${ACHIEVEMENTS.map((a) => `
          <div class="achievement ${char.achievements.includes(a.id) ? "earned" : "locked"}">
            <div class="ach-icon">${a.icon}</div>
            <div class="ach-name">${a.name}</div>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">\u{1F4CA} Hist\xF3rico</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        ${[["Miss\xF5es completas", countDone()], ["Streak atual", char.streak + " dias"], ["Livros lidos", countBooks()]].map(([l, v]) => `
          <div style="background:var(--surface2);border-radius:10px;padding:14px;text-align:center">
            <div style="font-size:20px;font-weight:700;color:var(--gold)">${v}</div>
            <div style="font-size:11px;color:var(--muted)">${l}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
    window._setCharName = () => {
      const v = document.getElementById("char-name-field")?.value.trim();
      if (!v) return;
      storage_default.update("character", (c) => {
        c.name = v;
        return c;
      });
      renderCharMini();
      renderPersonagem(document.getElementById("personagem"));
      const t = document.getElementById("xp-toast");
      if (t) {
        t.textContent = "\u270F\uFE0F Nome atualizado!";
        t.classList.remove("hidden");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.add("hidden"), 1500);
      }
    };
  }
  function countDone() {
    return (storage_default.get("tasks") || []).filter((t) => t.done).length;
  }
  function countBooks() {
    return ((storage_default.get("library") || {}).books || []).filter((b) => b.status === "done").length;
  }
  function renderDashboard2() {
    const char = storage_default.get("character");
    const tier = getTier(char.level);
    const p = progress(char.totalXP);
    const today = (/* @__PURE__ */ new Date()).toDateString();
    const tasks = (storage_default.get("tasks") || []).filter((t) => !t.date || t.date === today);
    const done = tasks.filter((t) => t.done).length;
    const svg = getAvatarSVG(char.level, 80);
    document.getElementById("dashboard").innerHTML = `
    <div class="char-page" style="padding:20px">
      <div class="char-left" style="min-width:100px">
        <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--gold));display:flex;align-items:center;justify-content:center;border:3px solid var(--gold);box-shadow:0 0 24px rgba(245,158,11,.4);margin:0 auto 8px">${svg}</div>
        <div class="char-level-badge" style="display:block;text-align:center">Nv ${char.level}</div>
        <div style="text-align:center;font-size:11px;color:var(--gold);margin-top:4px">${tier.emoji} ${tier.name}</div>
        <div style="text-align:center;font-size:13px;margin-top:6px">\u{1FA99} ${char.coins || 0}</div>
      </div>
      <div class="char-right">
        <div style="font-size:20px;font-weight:700;margin-bottom:6px">${char.name}</div>
        <div class="char-total-xp" style="margin-bottom:8px">"${tier.title}"</div>
        <div class="xp-progress-wrap">
          <div class="xp-progress-label"><span>N\xEDvel ${char.level} \u2192 ${char.level + 1}</span><span>${p.current}/${p.needed} XP</span></div>
          <div class="xp-bar-outer"><div class="xp-bar-inner" style="width:${p.pct}%"></div></div>
        </div>
        <div class="attrs-grid">
          ${Object.entries(ATTRS).map(([k, a]) => {
      const attr = char.attrs[k];
      const ap = progress(attr.xp);
      return `<div class="attr-row">
              <span class="attr-icon">${a.emoji}</span>
              <div class="attr-info">
                <div style="display:flex;justify-content:space-between">
                  <span class="attr-name">${a.name}</span>
                  <span style="font-size:12px;font-weight:700;color:${a.color}">Nv${attr.level}</span>
                </div>
                <div class="attr-bar-outer"><div class="attr-bar-inner" style="width:${ap.pct}%;background:${a.color}"></div></div>
              </div>
            </div>`;
    }).join("")}
        </div>
      </div>
    </div>

    <div class="grid-3" style="margin-bottom:16px">
      <div class="streak-card"><div class="streak-fire">\u{1F525}</div><div><div class="streak-count">${char.streak}</div><div class="streak-label">dias seguidos</div></div></div>
      <div class="card" style="margin:0"><div class="card-title">Miss\xF5es Hoje</div><div style="font-size:28px;font-weight:700;color:var(--gold)">${done}/${tasks.length}</div></div>
      <div class="card" style="margin:0"><div class="card-title">Conquistas</div><div style="font-size:28px;font-weight:700;color:var(--primary-l)">${char.achievements.length}</div></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">\u2694\uFE0F Miss\xF5es de Hoje</div>
        <button class="btn btn-primary btn-sm" onclick="window._openAddTask()">+ Miss\xE3o</button>
      </div>
      <div id="task-list"></div>
    </div>
  `;
    renderTaskList(tasks);
  }
  function renderTaskList(tasks) {
    const el = document.getElementById("task-list");
    if (!el) return;
    if (!tasks.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">\u2694\uFE0F</div>Nenhuma miss\xE3o hoje. Crie a primeira!</div>';
      return;
    }
    el.innerHTML = tasks.map((t) => {
      const attr = ATTRS[t.attr] || ATTRS.missao;
      return `<div class="task-item ${t.done ? "done" : ""}" id="task-${t.id}">
      <div class="task-check" onclick="window._toggleTask('${t.id}')">${t.done ? "\u2713" : ""}</div>
      <span class="task-attr">${attr.emoji}</span>
      <span class="task-name">${t.name}</span>
      <span class="task-xp">+${t.xp}XP \u{1FA99}${Math.ceil(t.xp / 2)}</span>
      <span class="badge badge-${diffBadge(t.diff)}">${t.diff}</span>
      <button class="task-delete" onclick="window._deleteTask('${t.id}')">\u{1F5D1}</button>
    </div>`;
    }).join("");
    window._toggleTask = (id) => {
      const tasks2 = storage_default.get("tasks");
      const t = tasks2.find((x) => x.id === id);
      if (!t || t.done) return;
      t.done = true;
      t.doneAt = (/* @__PURE__ */ new Date()).toISOString();
      storage_default.set("tasks", tasks2);
      addXP(t.xp, t.attr);
      renderDashboard2();
    };
    window._deleteTask = (id) => {
      storage_default.update("tasks", (ts) => ts.filter((t) => t.id !== id));
      renderDashboard2();
    };
  }
  function diffBadge(d) {
    return { facil: "green", medio: "gold", dificil: "red", epico: "purple" }[d] || "blue";
  }
  window._openAddTask = () => {
    const attrOpts = Object.entries(ATTRS).map(([k, v]) => `<option value="${k}">${v.emoji} ${v.name}</option>`).join("");
    const xpMap = { facil: 10, medio: 25, dificil: 50, epico: 100 };
    window._modalContent(`
    <div class="modal-title">\u2694\uFE0F Nova Miss\xE3o</div>
    <div class="form-group"><label>Nome</label><input id="t-name" placeholder="Ex: Meditar 15 minutos"></div>
    <div class="form-row">
      <div class="form-group"><label>Atributo</label><select id="t-attr">${attrOpts}</select></div>
      <div class="form-group"><label>Dificuldade</label>
        <select id="t-diff">
          <option value="facil">\u{1F7E2} F\xE1cil (+10XP \u{1FA99}5)</option>
          <option value="medio" selected>\u{1F7E1} M\xE9dio (+25XP \u{1FA99}12)</option>
          <option value="dificil">\u{1F534} Dif\xEDcil (+50XP \u{1FA99}25)</option>
          <option value="epico">\u{1F49C} \xC9pico (+100XP \u{1FA99}50)</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="window._saveTask()">Criar Miss\xE3o \u2694\uFE0F</button>
  `);
    window._saveTask = () => {
      const name = document.getElementById("t-name").value.trim();
      if (!name) return;
      const diff = document.getElementById("t-diff").value;
      storage_default.update("tasks", (ts) => [{ id: Date.now().toString(), name, attr: document.getElementById("t-attr").value, diff, xp: xpMap[diff], done: false, date: (/* @__PURE__ */ new Date()).toDateString(), createdAt: (/* @__PURE__ */ new Date()).toISOString() }, ...ts]);
      window._closeModal();
      renderDashboard2();
    };
  };
  renderCharMini();
  navigate("dashboard");
  if (syncEnabled() && !sessionStorage.getItem("rpg_pulled")) {
    sessionStorage.setItem("rpg_pulled", "1");
    pull().then((r) => {
      if (r && r.changed) location.reload();
    });
  }
  function showLevelUp2(char) {
    const tier = getTier(char.level);
    document.getElementById("levelup-avatar").innerHTML = getAvatarSVG(char.level, 80);
    document.getElementById("levelup-msg").innerHTML = `Voc\xEA atingiu o <b>N\xEDvel ${char.level}</b>!<br>${tier.emoji} <b>${tier.name}</b><br><i>"${tier.title}"</i>`;
    document.getElementById("levelup-overlay").classList.remove("hidden");
  }
  window._showLevelUp = showLevelUp2;
})();

</script>
